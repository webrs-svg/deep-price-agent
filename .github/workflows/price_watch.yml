name: 24/7 Deep Price, Deals & Multi-Hop Flight Watch

on:
  # Runs automatically every 6 hours in the cloud (even when your PC is turned off)
  schedule:
    - cron: "0 */6 * * *"

  # Allows triggering an immediate deep research run from GitHub Mobile or browser
  workflow_dispatch:
    inputs:
      mode:
        description: "Search Mode ('product' or 'flight')"
        required: true
        default: "flight"
        type: choice
        options:
          - flight
          - product

      # Flight Mode Inputs
      origin:
        description: "[Flight Mode] Origin airport or city (e.g. SYD, LHR, JFK)"
        required: false
        default: "SYD"
      destination:
        description: "[Flight Mode] Destination airport or city (e.g. SEA, DPS, NRT)"
        required: false
        default: "SEA"
      depart_date:
        description: "[Flight Mode] Departure date or month (e.g. 2027-08-01 or August 2027)"
        required: false
        default: "August 2027"
      return_date:
        description: "[Flight Mode] Return date or month (e.g. 2027-08-28)"
        required: false
        default: "August 2027"
      trip_type:
        description: "[Flight Mode] Trip type"
        required: false
        default: "return"
        type: choice
        options:
          - return
          - one-way
      checked_bag:
        description: "[Flight Mode] Include 1 Checked Bag (23kg)"
        required: false
        default: false
        type: boolean

      # Product Mode Inputs
      product_query:
        description: "[Product Mode] Product name to research"
        required: false
        default: ""
      sku:
        description: "[Product Mode] Exact SKU / Model / Variant"
        required: false
        default: ""

      # Common Inputs
      currency:
        description: "Target currency (AUD, USD, GBP, EUR, JPY, etc.)"
        required: false
        default: "AUD"
      target_price:
        description: "Optional target price / fare alert threshold"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  deep-price-and-flight-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "cloud/requirements.txt"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r cloud/requirements.txt
          npm install

      - name: Run Multi-Agent Deep Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ROUTESTACK_API_KEY: ${{ secrets.ROUTESTACK_API_KEY || 'rst_jWw6U4c796bpqAOJA82HsoxYroOT4yli' }}
          ROUTESTACK_API_SECRET: ${{ secrets.ROUTESTACK_API_SECRET || '524655d09798585cc4f5a94c41e99660229c2f4f7c92af2d18c5fefb4c19aef8' }}
          ROUTESTACK_MCP_URL: ${{ secrets.ROUTESTACK_MCP_URL || 'https://mcp.routestack.ai/sse' }}
        run: |
          if [ "${{ inputs.mode }}" = "flight" ]; then
            BAG_FLAG=""
            if [ "${{ inputs.checked_bag }}" = "true" ]; then
              BAG_FLAG="--checked-bag"
            fi
            python cloud/cloud_runner.py \
              --mode flight \
              --origin "${{ inputs.origin }}" \
              --destination "${{ inputs.destination }}" \
              --depart-date "${{ inputs.depart_date }}" \
              --return-date "${{ inputs.return_date }}" \
              --trip-type "${{ inputs.trip_type }}" \
              --currency "${{ inputs.currency }}" \
              --target-price "${{ inputs.target_price }}" \
              $BAG_FLAG
          elif [ -n "${{ inputs.product_query }}" ]; then
            python cloud/cloud_runner.py \
              --mode product \
              --product "${{ inputs.product_query }}" \
              --sku "${{ inputs.sku }}" \
              --currency "${{ inputs.currency }}" \
              --target-price "${{ inputs.target_price }}"
          else
            # Scheduled run: check all active items in both watchlists
            python cloud/cloud_runner.py --mode product
            python cloud/cloud_runner.py --mode flight
          fi

      - name: Commit & Push Updated Reports, Watchlist, and HTML Dashboard
        run: |
          git config user.name "24/7 Travel & Price Agent"
          git config user.email "actions@github.com"
          git add data/ reports/ dashboards/
          if git diff --staged --quiet; then
            echo "No price or flight changes to commit."
          else
            git commit -m "chore(travel): automated 24/7 multi-agent flight & price update [skip ci]"
            git push
          fi
